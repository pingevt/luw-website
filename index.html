    .floor {
      display: none;

      gap: 12px;
      width: min(720px, 92vw);
      margin-top: 56px;
      opacity: 0;
      transition: opacity 1.2s ease;

    .js .floor { display: grid; }
    .floor.ready { opacity: 1; }
    .tile {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(0.82);
      transition: opacity 2s ease, filter 0.4s ease;
    }
    .tile img.on { opacity: 1; }
    .tile:hover img { filter: brightness(1); }
    @media (max-width: 600px) {

  <script>
    // Workshop floor: a random 8 of the little monsters, one tile crossfading to a new monster
    // right after the previous fade ends (~0.75-1s pause). Only one fade at a time, and never two monsters from the same scene at once.
    (() => {
      const floor = document.querySelector(".floor");
      const tiles = [...floor.querySelectorAll(".tile")];
      const FADE = 2000, GAP_MIN = 750, GAP_MAX = 1000;  // pause after each fade finishes
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const shuffle = (a) => {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const load = (img, id) => {
        img.srcset = `/assets/grid/${id}-256.webp 256w, /assets/grid/${id}-512.webp 512w`;
        img.src = `/assets/grid/${id}-512.webp`;
        img.dataset.id = id;
        return img.decode().catch(() => {});
      };

      fetch("/assets/grid/manifest.json")
        .then((r) => r.json())
        .then(async (ids) => {
          // One monster per scene on screen: renders from the same prompt (same round + action,
          // any seed, figurine or puppet wording, any cfg) look alike, so they share a family.
          // e.g. r10_spoolpup2_8783015545311 and r10_spoolpup3_28919616181774 are both "r10_spool".
          const fam = (id) => id.replace(/_\d+$/, "").replace(/(fig|pup)\d$/, "");
          if (new Set(ids.map(fam)).size <= tiles.length) return;
          const onScreen = new Set();
          let deck = shuffle([...ids]);
          const draw = () => {
            let id = deck.pop();
            while (id != null && onScreen.has(fam(id))) id = deck.pop();
            return id;
          };
          const next = () => {
            let id = draw();
            if (id == null) {  // deck ran dry: reshuffle everything not on screen and try again
              deck = shuffle(ids.filter((i) => !onScreen.has(fam(i))));
              id = draw();
            }
            return id;
          };

          await Promise.all(tiles.map((t) => {
            const id = next();
            onScreen.add(fam(id));
            const img = t.firstElementChild;
            img.style.transition = "none";  // first set arrives with the grid, not as 8 separate fades
            img.classList.add("on");
            return load(img, id);
          }));
          floor.classList.add("ready");
          floor.offsetHeight;
          tiles.forEach((t) => (t.firstElementChild.style.transition = ""));
          if (still) return;

          let timer, last = -1;
          const schedule = (ms) => { clearTimeout(timer); timer = setTimeout(swap, ms); };
          const swap = async () => {
            if (document.hidden) return;
            const visible = tiles.map((t, i) => i).filter((i) => tiles[i].offsetParent && i !== last);
            const i = visible[Math.floor(Math.random() * visible.length)];
            const [a, b] = tiles[i].children;
            const front = a.classList.contains("on") ? a : b, back = front === a ? b : a;
            const id = next();
            if (id == null) return schedule(GAP_MIN);
            onScreen.add(fam(id));
            await load(back, id);
            back.classList.add("on");
            front.classList.remove("on");
            onScreen.delete(fam(front.dataset.id));
            last = i;
            schedule(FADE + GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN));
          };
          document.addEventListener("visibilitychange", () => document.hidden ? clearTimeout(timer) : schedule(GAP_MIN));
          schedule(2000 + Math.random() * 1000);  // first swap shortly after the grid appears
        })
        .catch(() => {});
    })();
  </script>
