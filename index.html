<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Urchin Workshop</title>
  <link rel="icon" type="image/png" href="/assets/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="description" content="Little Urchin Workshop LLC. Ardmore, PA. info@littleurchinworkshop.com">
  <meta name="theme-color" content="#0d0b0a">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://littleurchinworkshop.com/">
  <meta property="og:title" content="Little Urchin Workshop">
  <meta property="og:description" content="info@littleurchinworkshop.com">
  <meta property="og:image" content="https://littleurchinworkshop.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500,100,1&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0b0a;
      --ink: #f1e6d8;
      --muted: #a8917c;
      --accent: #e09a5f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Fraunces", Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 24px 16px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      max-width: 100%;
    }
    picture { display: block; width: min(560px, 88vw); aspect-ratio: 1; }
    picture img {
      width: 100%;
      height: 100%;
      display: block;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 70%);
              mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 70%);
    }
    h1 {
      margin: -2.5rem 0 0;
      font-weight: 500;
      font-size: clamp(1.9rem, 6vw, 3rem);
      letter-spacing: -0.01em;
      line-height: 1.05;
    }
    a {
      color: var(--accent);
      font-size: clamp(1rem, 3.6vw, 1.2rem);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      padding-bottom: 2px;
      overflow-wrap: anywhere;
    }
    a:hover, a:focus-visible { border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <picture>
      <source type="image/avif" srcset="/assets/hero-640.avif 640w, /assets/hero-1024.avif 1024w" sizes="(min-width: 640px) 560px, 88vw">
      <source type="image/webp" srcset="/assets/hero-640.webp 640w, /assets/hero-1024.webp 1024w" sizes="(min-width: 640px) 560px, 88vw">
      <img src="/assets/hero-1024.jpg" srcset="/assets/hero-640.jpg 640w, /assets/hero-1024.jpg 1024w" sizes="(min-width: 640px) 560px, 88vw" width="1024" height="1024" alt="A small slate-blue monster in a patched little coat, holding up a glowing lantern on a dark workbench">
    </picture>
    <h1>Little Urchin Workshop</h1>
    <a href="mailto:info@littleurchinworkshop.com">info@littleurchinworkshop.com</a>
  </main>
</body>
</html>
